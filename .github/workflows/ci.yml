name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hookline
          POSTGRES_PASSWORD: hookline
          POSTGRES_DB: hookline_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U hookline" --health-interval 5s --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://hookline:hookline@localhost:5432/hookline_test
      REDIS_URL: redis://localhost:6379
      TEST_DATABASE_URL: postgresql://hookline:hookline@localhost:5432/hookline_test
      TEST_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm --filter @hookline/db exec prisma migrate deploy
      - run: pnpm test
      - run: pnpm build
